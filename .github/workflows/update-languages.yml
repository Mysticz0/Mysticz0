name: Update language chart

# Runs weekly (Mondays 00:00 UTC) and only commits when the language totals changed.
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [repo-pushed]

permissions:
  contents: write

concurrency:
  group: update-languages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python .github/scripts/update_languages.py

      - name: Commit if changed
        run: |
          git add languages.svg
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update language chart"
          git push
